<title>The Ashen Gate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: one fixed 960x600 stage, a triptych of gate vista above, booth window bottom-left, desk bottom-right; scaled to fit */
:root{
  --ink:#0d0909; --soot:#1b1214; --char:#2a1c1e; --wood:#3b261a;
  --bone:#e2d1a9; --bone-shade:#b89d6e; --sepia:#3a2414; --sepia-soft:#6b4a2e;
  --ember:#d8642a; --blood:#a32222; --moss:#4e7d4f; --brass:#c39a45; --text:#eadbbd; --dim:#9c8a72;
  --f-display:"Jersey 15","Pixelify Sans","Courier New",monospace;
  --f-body:"Pixelify Sans","Courier New",monospace;
  --f-num:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{-webkit-touch-callout:none}
button{touch-action:manipulation}
#zoomback{position:absolute;inset:0;background:rgba(6,2,2,.68);z-index:45;display:none}
#stage.zooming #zoomback{display:block}
#stage.zooming #docs{z-index:46}
.doc.zoomed{cursor:zoom-out}
@media (max-width:600px){#app{padding-block:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:none}
#app{position:relative;height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#stage{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0;overflow:hidden;background:#000;box-shadow:0 0 0 3px #000,0 0 80px rgba(216,100,42,.12);user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#scene{position:absolute;left:0;top:0;width:960px;height:216px}
#booth{position:absolute;left:0;top:216px;width:336px;height:384px}
#boothc{width:336px;height:384px}
#desk{position:absolute;left:336px;top:216px;width:624px;height:384px}
#deskc{width:624px;height:384px}
#deskfx{position:absolute;left:0;top:0;width:624px;height:384px;pointer-events:none}
#grain,#vig{display:none!important}
#scene,#boothc,#deskc{filter:saturate(.82) contrast(1.04)}
#grain{position:absolute;left:0;top:0;width:960px;height:600px;pointer-events:none;z-index:44;opacity:.13;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;pointer-events:none;z-index:44;background:radial-gradient(ellipse 75% 70% at 50% 52%,transparent 60%,rgba(8,2,2,.5))}
#docs{position:absolute;left:0;top:216px;width:960px;height:384px;pointer-events:none;z-index:5}
#lines{position:absolute;inset:0;pointer-events:none;z-index:30}
#side{display:none}
/* Portrait: 540x1080 stage. Vista on top, booth with a tool column beside it, a tall desk below */
#stage.portrait{width:540px;height:1080px}
.portrait #scene{width:640px;height:144px}
.portrait #booth{top:144px}
.portrait #side{display:block;position:absolute;left:336px;top:144px;width:204px;height:384px;background:#24170f;box-shadow:inset 3px 0 0 #0e0806,inset 6px 0 0 #4a3220;border-bottom:3px solid #0e0806}
.portrait #side .sidet{font-family:var(--f-display);font-size:24px;color:#c9a96a;text-align:center;margin-top:12px;text-shadow:2px 2px 0 #000}
.portrait #side .sideh{font-size:11px;line-height:14px;color:#9c8a72;padding:0 16px;position:absolute;bottom:14px}
.portrait #tools{left:346px;right:auto;top:56px;bottom:auto;width:184px;flex-direction:column;gap:10px}
.portrait #tools .tool{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:8px 12px;min-width:0;width:100%}
.portrait #desk{left:0;top:528px;width:540px;height:552px}
.portrait #deskc,.portrait #deskfx{width:540px;height:552px}
.portrait #docs{top:144px;width:540px;height:936px}
.portrait #stampwrap{left:0;top:528px;width:540px;height:552px}
.portrait #banner{left:0;width:540px;top:540px}
.portrait #hint{max-width:500px;font-size:12px}
.portrait .title-h{font-size:66px}.portrait .title-s{max-width:440px}
.portrait .paper{width:504px;height:auto;padding:16px 18px 74px;transform:none}
.portrait .paper .mast{font-size:42px}.portrait .paper .head{font-size:32px}
.portrait .paper .cols{grid-template-columns:1fr}.portrait .paper .cut{margin:0 auto}
.portrait .ledger{width:524px;padding:16px 18px}.portrait .ledger h2{font-size:36px}
.portrait .cols2{grid-template-columns:1fr;gap:2px}
.portrait .doc.book{height:408px}
.portrait .endtxt{max-width:470px}
.warn{color:#ff9a7a;font-size:13px;margin:10px 0 0}
button{font-family:var(--f-body);cursor:pointer}
button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}

/* ---------- HUD plaques ---------- */
.plaque{position:absolute;background:#2a1d14;border:3px solid #0e0806;box-shadow:inset 0 0 0 2px #6b4f2c,inset 3px 3px 0 2px #8f6c3c;padding:3px 9px 2px;font-family:var(--f-num);color:#f0d9a0;text-shadow:2px 2px 0 #000;z-index:8}
#hud-date{left:12px;top:10px;font-size:22px;line-height:20px}
#hud-date small{display:block;font-size:15px;color:#c9a96a;letter-spacing:1px}
#hud-clock{right:12px;top:10px;font-size:30px;line-height:26px}
#hud-silver{left:12px;top:228px;font-size:18px;display:none}

/* ---------- speech ---------- */
.bubble{position:absolute;max-width:210px;padding:7px 10px;background:#eadfc4;color:#1b1110;font-size:13px;line-height:16px;border:3px solid #140c0a;box-shadow:4px 4px 0 rgba(0,0,0,.55);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;z-index:20;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.bubble b{font-weight:700;color:#7a1414;display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase}
#bub-t{right:10px;top:58px}
#bub-t::after{content:"";position:absolute;left:-12px;top:14px;border:6px solid transparent;border-right-color:#140c0a}
#bub-w{left:10px;bottom:118px;background:#2a1d18;color:#f0dfba;border-color:#000}
#bub-w b{color:var(--ember)}

/* ---------- booth tools ---------- */
#tools{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:12px;z-index:9}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;background:#2b1c13;color:#f2dca8;border:3px solid #0d0705;box-shadow:inset 0 0 0 2px #6e512e,4px 4px 0 rgba(0,0,0,.6);padding:5px 10px 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;min-width:84px}
.tool canvas{width:48px;height:36px}
.tool:hover:not(:disabled){background:#3b2618}
.tool:active:not(:disabled){transform:translate(2px,2px);box-shadow:inset 0 0 0 2px #6e512e,2px 2px 0 rgba(0,0,0,.6)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool .ct{font-family:var(--f-num);font-size:16px;color:#ffb46b;letter-spacing:0}

/* ---------- documents ---------- */
.doc{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;color:var(--sepia);background-color:var(--bone);background-image:var(--paper);background-size:192px 192px;image-rendering:pixelated;
  clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
  filter:drop-shadow(5px 5px 0 rgba(0,0,0,.5))}
.doc.dragging{cursor:grabbing;filter:drop-shadow(9px 11px 0 rgba(0,0,0,.42))}
.doc.fly{transition:left .45s cubic-bezier(.2,.8,.3,1),top .45s cubic-bezier(.2,.8,.3,1),opacity .35s,transform .35s}
.doc .inner{position:absolute;inset:6px;border:2px solid var(--sepia-soft);box-shadow:inset 0 0 0 2px rgba(107,74,46,.25)}
.doc h3{margin:0;font-family:var(--f-display);font-weight:400;color:#7a1712;text-align:center;line-height:1}
.doc .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;text-align:center;color:var(--sepia-soft)}
.doc .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--sepia-soft);margin-top:5px}
.doc .val{font-size:14px;line-height:15px;color:#24150c;font-weight:600}
.doc .num{font-family:var(--f-num);font-size:20px;line-height:16px;font-weight:400}
.mark{position:absolute;pointer-events:none;font-family:var(--f-display);font-size:25px;line-height:1;padding:3px 8px 1px;border:3px solid currentColor;outline:2px solid currentColor;outline-offset:2px;opacity:.82;mix-blend-mode:multiply;white-space:nowrap;animation:thump .2s ease-out}
@keyframes thump{from{transform:var(--rot) scale(1.35);opacity:0}to{transform:var(--rot) scale(1)}}
.m-admit{color:#2f6b2f}.m-deny{color:#241a16}.m-condemn{color:#a01616}

/* writ */
.writ{width:198px;height:290px}
.writ .row2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px 12px 0}.writ .row2 .val{font-size:12px;line-height:13px}
.writ h3{font-size:30px;margin-top:10px}
.writ .row{display:flex;gap:9px;padding:6px 12px 0}
.writ .likeness{width:54px;height:84px;border:2px solid var(--sepia);box-shadow:2px 2px 0 rgba(58,36,20,.3);flex:none}
.writ .fields{min-width:0;flex:1}
.writ .sealwrap{position:absolute;left:0;right:0;bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.writ .seal{width:48px;height:48px}
.writ .sealtxt{font-size:10px;letter-spacing:1px;line-height:11px;color:var(--sepia-soft);text-transform:uppercase;max-width:84px}
/* bill */
.bill{width:182px;height:238px;background-color:#d9cfb4}
.bill h3{font-size:27px;margin-top:10px}
.bill .body{padding:6px 14px 0;font-size:11px;line-height:13px;color:#3b2a1c}
.bill .sig{font-family:var(--f-num);font-size:19px;line-height:16px;color:#1c2240;border-bottom:1px solid var(--sepia-soft);display:inline-block;padding:0 4px;margin-top:2px}
.bill .emb{position:absolute;right:14px;bottom:16px;width:36px;height:36px}
/* rulebook */
.book{width:258px;height:318px;background:#3a1f16;filter:drop-shadow(5px 5px 0 rgba(0,0,0,.55));clip-path:none;border:3px solid #120806;box-shadow:inset 0 0 0 3px #6d3b24}
.book .tabs{display:flex;gap:3px;padding:6px 8px 0}
.book .tab{flex:1;background:#5b3020;color:#e9c99a;border:2px solid #120806;border-bottom:none;font-family:var(--f-display);font-size:21px;line-height:27px;padding:0;cursor:pointer}
.book .tab.on{background:var(--bone);color:#7a1712}
.book .page{position:absolute;left:8px;right:8px;top:37px;bottom:8px;background-color:var(--bone);background-image:var(--paper);background-size:192px;padding:8px 10px;color:var(--sepia);overflow:hidden}
.book .page h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:22px;color:#7a1712;line-height:1;text-align:center}
.book .page p,.book .page li{font-size:11px;line-height:13px;margin:0 0 5px}
.book .page ol li{font-size:11.5px;line-height:13px;margin:0 0 4px}.book .page{overflow-y:auto;scrollbar-width:thin}
.book ol{margin:0;padding-left:16px}
.book li.new{color:#7a1712;font-weight:700}
.sealgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px}
.sealcell{display:flex;align-items:center;gap:5px;font-size:11px;line-height:12px;padding:2px}
.sealcell canvas{width:36px;height:36px;flex:none}
.signrow{display:flex;gap:7px;align-items:center;margin-bottom:6px;padding:2px}
.signrow canvas{width:42px;height:42px;flex:none;border:2px solid var(--sepia-soft)}
.signrow span{font-size:11px;line-height:13px}
.reglist{list-style:none;padding:0;margin:0}
.reglist li{font-size:12px;border-bottom:1px dotted var(--sepia-soft);padding:2px 0}
.pagefoot{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--f-num);font-size:14px;color:var(--sepia-soft)}

/* citation slip */
.slip{position:absolute;width:210px;padding:8px 10px;background:#e8b9a9;color:#3b0d0d;font-size:11px;line-height:13px;border-top:3px dashed #7d2a2a;z-index:40;pointer-events:none;box-shadow:5px 5px 0 rgba(0,0,0,.5);animation:slipin .4s ease-out}
.slip b{display:block;font-family:var(--f-display);font-size:20px;font-weight:400;line-height:1;color:#7a0d0d}
@keyframes slipin{from{transform:translateY(-40px);opacity:0}}

/* ---------- inspect ---------- */
#stage.inspecting [data-f]{cursor:crosshair;outline:2px dashed rgba(196,40,30,.55);outline-offset:1px}
#stage.inspecting [data-f]:hover{outline:2px solid #d0281e;background-color:rgba(208,40,30,.08)}
#stage.inspecting [data-f].picked{outline:3px solid #d0281e;background-color:rgba(208,40,30,.16)}
#stage.inspecting .doc{cursor:default}
#stage.inspecting::after{content:"";position:absolute;inset:216px 0 0;pointer-events:none;box-shadow:inset 0 0 0 4px #b3201a;z-index:29}
#insp-face{position:absolute;left:96px;top:30px;width:144px;height:240px;z-index:7}
#banner{position:absolute;left:336px;width:624px;top:226px;text-align:center;z-index:35;pointer-events:none}
#banner span{display:inline-block;background:#170c0b;border:3px solid #b3201a;color:#ffd8c4;padding:4px 14px;font-size:14px;letter-spacing:1px;box-shadow:4px 4px 0 rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#banner span.on{opacity:1}
#banner span.ok{border-color:#6f6457;color:#d8ccb4}

/* ---------- desk controls ---------- */
#btn-inspect{position:absolute;right:12px;bottom:12px;z-index:12}
#stamptab{position:absolute;right:12px;top:8px;z-index:14;background:#1c1210;color:#e9c99a;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a3a20,3px 3px 0 rgba(0,0,0,.6);font-size:11px;letter-spacing:2px;padding:4px 8px}
#stampwrap{position:absolute;left:336px;top:216px;width:624px;height:384px;overflow:hidden;pointer-events:none;z-index:13}
#stampbar{position:absolute;left:0;right:0;top:0;height:100px;transform:translateY(-104%);transition:transform .35s cubic-bezier(.3,1.3,.5,1);pointer-events:auto;background:linear-gradient(#1a1210,#2a1d16);border-bottom:4px solid #000;box-shadow:inset 0 -3px 0 #6b4a2a,0 6px 0 rgba(0,0,0,.4);display:flex;justify-content:center;gap:26px;padding-top:4px}
#stampbar.open{transform:none}
.stamp{width:96px;height:92px;background:none;border:none;padding:0;position:relative;transition:transform .08s}
.stamp canvas{width:96px;height:72px;margin:0 auto}
.stamp span{display:block;font-size:11px;letter-spacing:1.5px;color:#e7cfa0;text-transform:uppercase;margin-top:-2px}
.stamp.press{transform:translateY(34px)}
#hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);max-width:560px;text-align:center;font-size:11px;line-height:14px;color:#e6cf9e;background:rgba(14,8,6,.82);border:2px solid #4a3220;padding:5px 8px;z-index:11;pointer-events:none}
#mute{position:absolute;right:8px;top:8px;z-index:60;background:rgba(0,0,0,.55);color:#e9c99a;border:2px solid #4a3220;font-size:11px;padding:3px 7px}

/* ---------- overlay screens ---------- */
#overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,10,8,.55),rgba(5,2,2,.94) 70%)}
#overlay[hidden]{display:none!important}
.screen{text-align:center}
.title-h{font-family:var(--f-display);font-size:120px;line-height:.9;color:#f1d6a2;text-shadow:0 0 0 #000,5px 5px 0 #4a0d0a,10px 10px 0 rgba(0,0,0,.5);margin:0;letter-spacing:2px}
.title-k{font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--ember);margin:10px 0 6px}
.title-s{font-size:14px;color:#c9b693;max-width:520px;margin:0 auto 26px;line-height:19px}
.bigbtn{background:#4a120e;color:#ffe2b8;border:3px solid #000;box-shadow:inset 0 0 0 2px #a8402a,6px 6px 0 rgba(0,0,0,.6);font-size:16px;letter-spacing:3px;text-transform:uppercase;padding:10px 26px}
.bigbtn:hover{background:#651a12}
.bigbtn:active{transform:translate(3px,3px);box-shadow:inset 0 0 0 2px #a8402a,3px 3px 0 rgba(0,0,0,.6)}
/* newspaper */
.paper{width:560px;height:530px;position:relative;background-color:#d8caa6;background-image:var(--paper);background-size:192px;color:#21160e;text-align:left;padding:18px 24px;box-sizing:border-box;filter:drop-shadow(10px 10px 0 rgba(0,0,0,.6));transform:rotate(-1.2deg)}
.paper .mast{font-family:var(--f-display);font-size:54px;line-height:1;text-align:center;border-bottom:3px double #21160e;padding-bottom:4px}
.paper .dl{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:17px;border-bottom:2px solid #21160e;padding:2px 0;margin-bottom:10px}
.paper .head{font-family:var(--f-display);font-size:38px;line-height:.95;text-align:center;margin:4px 0 10px;text-wrap:balance}
.paper .cols{display:grid;grid-template-columns:200px 1fr;gap:14px}
.paper .cut{width:200px;height:150px;border:2px solid #21160e}
.paper p{font-size:11.5px;line-height:15px;margin:0 0 8px}
.paper .ord{margin-top:10px;border:3px solid #6d1410;padding:8px 10px;background:rgba(160,30,20,.08)}
.paper .ord b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:#6d1410;line-height:1}
.paper .go{position:absolute;right:22px;bottom:18px}
/* ledger */
.ledger{width:600px;background:#1c1311;border:3px solid #000;box-shadow:inset 0 0 0 3px #5a3a22,10px 10px 0 rgba(0,0,0,.6);padding:20px 28px;text-align:left;box-sizing:border-box}
.ledger h2{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;color:#f0d29a;line-height:1}
.ledger .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:3px 0;border-bottom:1px dotted #4a3424;gap:12px}
.ledger .row .n{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums;color:#f6d79a}
.ledger .neg{color:#ff8a6a!important}
.ledger label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ledger input{accent-color:#a8402a;width:16px;height:16px}
.ledger .sec{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ember);margin:14px 0 4px}
.fam{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.famc{background:#120b0a;border:2px solid #3a2618;padding:6px 8px;font-size:13px}
.famc i{display:block;font-style:normal;font-size:11px;color:#9ed39a}
.famc i.bad{color:#ff9a7a}.famc i.dead{color:#8a7d70;text-decoration:line-through}
.ledger .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.endtxt{max-width:560px;margin:0 auto;font-size:14px;line-height:20px;color:#d9c7a3}

/* transcript tape, Brotherhood note, red cord, holy water */
.doc.tape{width:228px;padding:5px 8px 6px;background:#e6e1d2;color:#2a2830;clip-path:none;font-family:var(--f-num);border-left:3px dotted #b8b0a0;border-right:3px dotted #b8b0a0;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45))}
.tape .th{font-size:13px;letter-spacing:1px;border-bottom:1px dashed #8a8478;margin-bottom:2px;color:#5a5650}
.tape .tl{font-size:14px;line-height:12px;margin:2px 0;color:#2a2830}.tape .tl b{color:#7a1712;font-weight:400}
.doc.note{width:176px;padding:10px 12px;background-color:#d6c49c;font-size:11px;line-height:14px;color:#2a1a10;transform:rotate(-2deg)}
.note p{margin:0 0 6px}.note .nt{font-family:var(--f-display);font-size:22px;color:#6a1a14}.note .ns{text-align:right;font-family:var(--f-display);font-size:18px;color:#8a1a14}
.cord{position:absolute;right:18px;top:-2px;width:9px;height:74px;background:repeating-linear-gradient(#b02020 0 3px,#701010 3px 6px);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);pointer-events:none}

function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function px(c,x,y,col){rect(c,x,y,1,1,col)}
function ell(c,cx,cy,rx,ry,col){c.fillStyle=col;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));c.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1)}}

 {date:14,cut:'doctor',head:'THE HOLLOWING REACHES THE OUTER PARISHES',

let AC=null,master=null,droneOn=false;
function audio(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(e){AC=null}return AC}
function noise(dur,f,q,vol){if(!AC||G.muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(master);s.start()}
function tone(f,dur,type,vol,slide){if(!AC||G.muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g).connect(master);o.start();o.stop(AC.currentTime+dur)}

  [55,55.4,82.4].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start()});
  const n=AC.sampleRate*4,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.7;const wg=AC.createGain();wg.gain.value=.05;s.connect(bp).connect(wg).connect(master);s.start();

function rulesFor(t,day){
  const today=DAYS[day].date,D=DAYS[day],f=[];
  if(t.expiry<today)f.push('expired');
  if(!SIGOF[t.parish])f.push('unknown');else if(t.seal!==SIGOF[t.parish])f.push('forged');
  if(t.likeness!==t.p)f.push('likeness');
  if(day>=2){if(!t.hasBill)f.push('nobill');else{if(t.bill.name!==t.name)f.push('name');if(!registryOn(day).includes(t.bill.phys))f.push('phys');if(t.bill.exam<today-billAgeOn(day))f.push('stale')}}
  if(D.only&&SIGOF[t.parish]&&!ONLY_PARISHES.includes(t.parish)&&!sealedOn(day).includes(t.parish))f.push('notlisted');
  if(day>=3&&t.said!==t.purpose)f.push('purpose');if(day>=5&&t.marks!==markOf(t.p))f.push('marks');
  return f}
function genTraveller(day,idx){
  const D=DAYS[day],today=D.date,sc=(D.cast||[]).find(c=>c.at===idx);
  const r=mulberry(Math.floor(R()*1e9));
  const cast=sc&&CAST[sc.id];
  const p=makePerson(cast?mulberry(cast.seed):r);if(cast)Object.assign(p,cast.ov||{});
  const sealed=sealedOn(day);
  let pool=PARISHES.filter(x=>!sealed.includes(x.name)&&(!D.only||ONLY_PARISHES.includes(x.name)||r()<.3));
  const t={p,name:cast?cast.name:pick(FIRST,r)+' '+pick(LAST,r),parish:cast?cast.parish:pick(pool,r).name,expiry:today+1+Math.floor(r()*40),likeness:p,faults:[],infected:false,sealed:false,cursed:false,cord:false,cast:sc&&sc.id};
  t.seal=SIGOF[t.parish];t.purpose=pick(PURPOSES,r);t.said=t.purpose;
  if(day>=2){const reg=registryOn(day);t.hasBill=true;t.bill={name:t.name,exam:today-Math.floor(r()*Math.min(2,billAgeOn(day)+1)),phys:pick(reg,r)}}
  const infect=(deep)=>{t.infected=true;p.falseShadow=!deep;
    if(deep){t.cursed=true;return}
    if(day>=4&&r()<.55)t.cursed=true;
    const shadowOnly=day>=2&&r()<.4;
    if(!shadowOnly){const n=r()<.3?2:1;for(let i=0;i<n;i++){const s=pick(['veins','eyes','tears'],r);if(s==='eyes')p.signs.eyes=r()<.5?'white':'ember';else p.signs[s]=true}if(p.decoy==='patch'&&p.signs.eyes)p.decoy=null}};
  const fault=f=>{t.faults.push(f);
    if(f==='expired')t.expiry=today-1-Math.floor(r()*20);
    if(f==='forged')t.seal=pick(Object.keys(SIGILS).filter(k=>k!==t.seal),r);
    if(f==='unknown'){t.parish=pick(FAKE_PARISH,r);t.seal=pick(Object.keys(SIGILS),r)}
    if(f==='likeness')t.likeness=altPerson(p,r);
    if(f==='nobill')t.hasBill=false;
    if(f==='name')t.bill.name=variantName(t.name,r);
    if(f==='phys')t.bill.phys=day>=6&&r()<.5?'Dr. Hemming Roe':pick(FAKE_PHYS,r);
    if(f==='stale')t.bill.exam=today-billAgeOn(day)-1-Math.floor(r()*4);
    if(f==='purpose')t.said=pick(PURPOSES.filter(x=>x!==t.purpose),r);
    if(f==='marks')t.marks=pick(['None',...Object.values(MARKS)].filter(x=>x!==markOf(p)),r)};
  if(cast){
    if(cast.signs){t.infected=true;p.falseShadow=true;Object.assign(p.signs,cast.signs);if(day>=4)t.cursed=true}
    if(cast.deep)infect(true);
    if(cast.cord)t.cord=true;
    if(cast.fault)fault(cast.fault);
    if(cast.note)t.note=true;
    t.lines=typeof cast.lines==='function'?cast.lines():cast.lines;
  }else if(sc&&sc.id==='cord'){t.cord=true;if(!D.cordCondemn)fault(pick(D.faults.filter(f=>f!=='nobill'||day>=2),r))}
  else if(sc&&sc.id==='roebill'){t.bill.phys='Dr. Hemming Roe'}
  else{const roll=r();
    if(day===1&&idx===0){/* the first soul of the vigil is always clean */}
    else if(roll<D.inf)infect(D.deep&&r()<D.deep);
    else if(roll<D.inf+.13&&sealed.length){t.parish=pick(sealed,r);t.seal=SIGOF[t.parish]}
    else if(roll<D.inf+.5)fault(pick(D.faults,r))}

  t.sealed=sealed.includes(t.parish);
  t.faults=rulesFor(t,day);
  t.verdict=t.infected||t.sealed||(t.cord&&D.cordCondemn)?'condemn':t.faults.length?'deny':'admit';
  if(D.bribes&&!cast&&t.faults.length&&!t.infected&&!t.sealed&&r()<.3)t.bribe=5*(1+Math.floor(r()*3));
  return t;
}

  <div class="foot"><span style="font-size:15px">Remaining: <span class="n" id="rem" style="font-family:var(--f-num);font-size:26px">0</span> silver</span><button class="bigbtn" id="sleep">Sleep</button></div></div>`;
